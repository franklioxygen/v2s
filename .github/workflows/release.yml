name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Parse version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi

          case "$TAG" in
            v*)
              ;;
            *)
              echo "::error::Expected tag in the form v<version>, got: $TAG"
              exit 1
              ;;
          esac

          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release app
        run: |
          xcodebuild \
            -project v2s.xcodeproj \
            -scheme v2s \
            -configuration Release \
            -derivedDataPath .build/release \
            build

      - name: Verify universal binary
        run: |
          APP_BINARY=".build/release/Build/Products/Release/v2s.app/Contents/MacOS/v2s"
          ARCHS="$(lipo -archs "$APP_BINARY")"
          echo "Built architectures: $ARCHS"

          for required in arm64 x86_64; do
            case " $ARCHS " in
              *" $required "*)
                ;;
              *)
                echo "::error::Release binary is missing the $required slice"
                exit 1
                ;;
            esac
          done

      # Developer ID signing + notarization. Runs only when the signing secrets
      # are configured; otherwise the release stays ad-hoc signed as before.
      - name: Import Developer ID certificate
        id: signing
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          # The install docs promise a notarized app, so never publish an ad-hoc build.
          if [ -z "$DEVELOPER_ID_P12_BASE64" ] || [ -z "$DEVELOPER_ID_P12_PASSWORD" ]; then
            echo "::error::DEVELOPER_ID_P12_BASE64 / DEVELOPER_ID_P12_PASSWORD are not set; refusing to publish an unsigned build."
            exit 1
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"

          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -P "$DEVELOPER_ID_P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No 'Developer ID Application' identity found in the imported certificate"
            exit 1
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      - name: Sign app with Developer ID
        if: steps.signing.outputs.enabled == 'true'
        env:
          IDENTITY: ${{ steps.signing.outputs.identity }}
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          APP_PATH=".build/release/Build/Products/Release/v2s.app"
          SIGN=(codesign --force --timestamp --options runtime --keychain "$KEYCHAIN" --sign "$IDENTITY")

          # Sign Sparkle's nested helpers inside-out, as Sparkle's docs require.
          SPARKLE="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          if [ -d "$SPARKLE" ]; then
            SPARKLE_B="$SPARKLE/Versions/B"
            [ -d "$SPARKLE_B/XPCServices/Installer.xpc" ] && "${SIGN[@]}" "$SPARKLE_B/XPCServices/Installer.xpc"
            [ -d "$SPARKLE_B/XPCServices/Downloader.xpc" ] && "${SIGN[@]}" --preserve-metadata=entitlements "$SPARKLE_B/XPCServices/Downloader.xpc"
            [ -e "$SPARKLE_B/Autoupdate" ] && "${SIGN[@]}" "$SPARKLE_B/Autoupdate"
            [ -d "$SPARKLE_B/Updater.app" ] && "${SIGN[@]}" "$SPARKLE_B/Updater.app"
            "${SIGN[@]}" "$SPARKLE"
          fi

          # Any other embedded frameworks or dylibs.
          find "$APP_PATH/Contents/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
            ! -name 'Sparkle.framework' -print0 2>/dev/null \
            | while IFS= read -r -d '' item; do "${SIGN[@]}" "$item"; done

          "${SIGN[@]}" --entitlements Config/v2s.entitlements "$APP_PATH"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -d --entitlements - "$APP_PATH"

      - name: Notarize and staple
        if: steps.signing.outputs.enabled == 'true'
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: |
          if [ -z "$ASC_API_KEY_ID" ] || [ -z "$ASC_API_ISSUER_ID" ] || [ -z "$ASC_API_KEY_P8_BASE64" ]; then
            echo "::error::Developer ID signing is enabled but the ASC_API_* notarization secrets are missing"
            exit 1
          fi

          APP_PATH=".build/release/Build/Products/Release/v2s.app"
          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          SUBMIT_ZIP="$RUNNER_TEMP/v2s-notarize.zip"

          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$SUBMIT_ZIP"

          xcrun notarytool submit "$SUBMIT_ZIP" \
            --key "$KEY_PATH" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" \
            --wait --timeout 30m --output-format json | tee "$RUNNER_TEMP/notary.json"

          STATUS="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")"
          if [ "$STATUS" != "Accepted" ]; then
            SUBMISSION_ID="$(/usr/bin/python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' "$RUNNER_TEMP/notary.json")"
            xcrun notarytool log "$SUBMISSION_ID" \
              --key "$KEY_PATH" --key-id "$ASC_API_KEY_ID" --issuer "$ASC_API_ISSUER_ID" || true
            echo "::error::Notarization status: $STATUS"
            exit 1
          fi

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type execute --verbose=4 "$APP_PATH"
          rm -f "$KEY_PATH" "$SUBMIT_ZIP"

      - name: Package app
        id: package
        run: |
          APP_PATH=".build/release/Build/Products/Release/v2s.app"
          ZIP_PATH="dist/v2s-${{ steps.version.outputs.version }}.app.zip"
          CHECKSUM_PATH="dist/v2s-${{ steps.version.outputs.version }}.sha256"

          mkdir -p dist
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"
          (cd dist && shasum -a 256 "$(basename "$ZIP_PATH")" > "$(basename "$CHECKSUM_PATH")")

          echo "zip=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"

      - name: Generate appcast
        run: |
          # Find Sparkle bin directory from SPM build artifacts
          SPARKLE_BIN=""
          for candidate in \
            "$(find .build -name generate_appcast -type f 2>/dev/null | head -1)"; do
            if [ -n "$candidate" ] && [ -f "$candidate" ]; then
              SPARKLE_BIN="$(dirname "$candidate")"
              break
            fi
          done

          if [ -z "$SPARKLE_BIN" ]; then
            echo "::error::Could not find generate_appcast in .build artifacts"
            exit 1
          fi

          echo "Sparkle bin: $SPARKLE_BIN"

          # Write EdDSA private key to a temporary file
          KEY_FILE="$(mktemp)"
          echo "${{ secrets.SPARKLE_PRIVATE_KEY }}" > "$KEY_FILE"

          # Download previous appcast if it exists, so generate_appcast can append
          curl -fsSL \
            "https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml" \
            -o dist/appcast.xml 2>/dev/null || true

          "$SPARKLE_BIN/generate_appcast" \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/" \
            --link "https://github.com/${{ github.repository }}" \
            dist/

          rm -f "$KEY_FILE"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "${{ steps.package.outputs.zip }}" \
              "${{ steps.package.outputs.checksum }}" \
              dist/appcast.xml \
              --clobber
          else
            gh release create "$TAG" \
              "${{ steps.package.outputs.zip }}" \
              "${{ steps.package.outputs.checksum }}" \
              dist/appcast.xml \
              --title "$TAG" \
              --generate-notes \
              --verify-tag
          fi

      - name: Update Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: franklioxygen/homebrew-v2s
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set; skipping Homebrew tap update."
            exit 0
          fi

          SHA256="$(awk '{print $1}' "${{ steps.package.outputs.checksum }}")"
          if [ -z "$SHA256" ]; then
            echo "::error::Could not read the release checksum"
            exit 1
          fi

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap

          # Republishing an older tag must not downgrade the cask users install.
          TAPPED_VERSION=""
          if [ -f tap/Casks/v2s.rb ]; then
            TAPPED_VERSION="$(sed -n 's/^  version "\(.*\)"$/\1/p' tap/Casks/v2s.rb | head -1)"
          fi
          if [ -n "$TAPPED_VERSION" ] && [ "$TAPPED_VERSION" != "$VERSION" ]; then
            NEWEST="$(printf '%s\n%s\n' "$TAPPED_VERSION" "$VERSION" | sort -V | tail -1)"
            if [ "$NEWEST" != "$VERSION" ]; then
              echo "Tap already has ${TAPPED_VERSION}, which is newer than ${VERSION}; skipping."
              exit 0
            fi
          fi

          mkdir -p tap/Casks
          sed \
            -e "s/__VERSION__/${VERSION}/g" \
            -e "s/__SHA256__/${SHA256}/g" \
            packaging/homebrew/v2s.rb.template > tap/Casks/v2s.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/v2s.rb

          if git diff --cached --quiet; then
            echo "Cask already up to date."
            exit 0
          fi

          git commit -m "v2s ${VERSION}"
          git push

      - name: Remove signing keychain
        if: always() && steps.signing.outputs.keychain != ''
        run: security delete-keychain "${{ steps.signing.outputs.keychain }}" || true
