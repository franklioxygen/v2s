name: App Store

# Builds the sandboxed v2s-AppStore target and uploads it to App Store Connect.
# Run it by hand after a release tag exists; submitting for review is then done
# in App Store Connect.
#
# Required secrets:
#   APPLE_TEAM_ID          10-character Team ID (developer.apple.com > Membership)
#   ASC_API_KEY_ID         App Store Connect API key ID (key role: Admin, so Xcode
#   ASC_API_ISSUER_ID      can create the distribution certificate and profile)
#   ASC_API_KEY_P8_BASE64  base64 of the downloaded AuthKey_XXXX.p8

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (e.g. v0.4.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Write App Store Connect API key
        id: key
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          for name in APPLE_TEAM_ID ASC_API_KEY_ID ASC_API_ISSUER_ID ASC_API_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set"
              exit 1
            fi
          done

          KEY_PATH="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          echo "$ASC_API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          xcodebuild \
            -project v2s.xcodeproj \
            -scheme v2s-AppStore \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/v2s.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.key.outputs.path }}" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive

      - name: Check the archive does not contain Sparkle
        run: |
          APP="$RUNNER_TEMP/v2s.xcarchive/Products/Applications/v2s.app"
          if [ -e "$APP/Contents/Frameworks/Sparkle.framework" ]; then
            echo "::error::Sparkle.framework is embedded in the App Store build"
            exit 1
          fi
          codesign -d --entitlements - "$APP"

      - name: Export and upload to App Store Connect
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/v2s.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${{ steps.key.outputs.path }}" \
            -authenticationKeyID "$ASC_API_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_API_ISSUER_ID"

      - name: Remove API key
        if: always()
        run: rm -f "$RUNNER_TEMP"/AuthKey_*.p8
